version: 2

updates:
  # The workflow files pin action versions, and a pinned action is the one
  # dependency here that nothing else updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'

  # No composer.lock is committed, so this only ever touches the constraints in
  # composer.json — in practice the dev dependencies.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: 'chore(dev)'
