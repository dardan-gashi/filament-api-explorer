name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Spelled out rather than built from axes: the Laravel version is chosen by
    # the Testbench major, so the two travel together and a cross product would
    # produce pairs that cannot resolve.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: 12, testbench: '^10.0', dependencies: highest }
          - { php: '8.4', laravel: 12, testbench: '^10.0', dependencies: highest }
          - { php: '8.5', laravel: 12, testbench: '^10.0', dependencies: highest }
          - { php: '8.3', laravel: 13, testbench: '^11.0', dependencies: highest }
          - { php: '8.4', laravel: 13, testbench: '^11.0', dependencies: highest }
          - { php: '8.5', laravel: 13, testbench: '^11.0', dependencies: highest }
          - { php: '8.3', laravel: 12, testbench: '^10.0', dependencies: lowest }

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependencies }} deps

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      # No composer.lock is committed — a library resolves against the
      # application it lands in, so the matrix resolves it here too.
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-L${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-L${{ matrix.laravel }}-${{ matrix.dependencies }}-

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi
          composer show | grep -E '^(laravel/framework|filament/filament|dedoc/scramble) ' || true

      - name: Check the code style
        run: vendor/bin/pint --test

      - name: Analyse
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Test
        run: vendor/bin/pest --parallel
